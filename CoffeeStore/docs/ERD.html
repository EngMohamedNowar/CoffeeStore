<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark" />
<title>CoffeeStore — Entity Relationship Diagram</title>
<style>
  :root {
    --bg: #050608;
    --panel: #0b0d11;
    --panel2: #10131a;
    --line: #1c2129;
    --line2: #2a313c;
    --ink: #e6e9ee;
    --muted: #7d8794;
    --store: #4dabf7;
    --identity: #b197fc;
    --redis: #ff6b6b;
    --logic: #38d9a9;
    --pk: #ffd43b;
    --ok: #51cf66;
    --warn: #fcc419;
    --mono: "JetBrains Mono", "Cascadia Code", "SF Mono", "Fira Code", Consolas, "Courier New", monospace;
    --ui: "Segoe UI", Tahoma, "Noto Sans Arabic", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--ui);
    display: flex; flex-direction: column; overflow: hidden;
  }

  /* ───────── شريط الأدوات ───────── */
  .bar {
    flex: none; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 18px; background: var(--panel); border-bottom: 1px solid var(--line);
    z-index: 5;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot {
    width: 11px; height: 11px; border-radius: 50%;
    background: conic-gradient(var(--store), var(--identity), var(--redis), var(--store));
    box-shadow: 0 0 12px rgba(177,151,252,.55);
  }
  .brand h1 { font-size: 15px; margin: 0; font-family: var(--mono); letter-spacing: .3px; font-weight: 700; }
  .chip {
    direction: ltr; unicode-bidi: isolate;
    font-family: var(--mono); font-size: 11px; color: var(--muted);
    border: 1px solid var(--line2); border-radius: 999px; padding: 2px 10px;
  }
  .spacer { flex: 1; }
  .group { display: flex; gap: 6px; align-items: center; }
  .btn {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line2);
    border-radius: 8px; padding: 6px 12px; font-size: 12.5px; cursor: pointer;
    font-family: var(--ui); transition: .15s;
  }
  .btn:hover { border-color: #55606e; background: #151922; }
  .btn.on { border-color: var(--c, #fff); color: var(--c, #fff); background: color-mix(in srgb, var(--c, #fff) 12%, var(--panel2)); }
  .btn.icon { padding: 6px 10px; font-family: var(--mono); font-weight: 700; }
  .sep { width: 1px; height: 22px; background: var(--line2); }
  #zoomLabel { font-family: var(--mono); font-size: 11.5px; color: var(--muted); min-width: 44px; text-align: center; }

  /* ───────── اللوحة ───────── */
  .stage { position: relative; flex: 1; min-height: 0; }
  #cv { width: 100%; height: 100%; display: block; direction: ltr; cursor: grab; touch-action: none; user-select: none; }
  #cv.panning { cursor: grabbing; }
  .card { transition: opacity .15s; }
  .link { transition: opacity .15s; }
  .row-bg { transition: fill .1s; }
  .row-bg:hover { fill: rgba(255,255,255,.06); }

  /* ───────── الدليل ───────── */
  .legend {
    position: absolute; left: 16px; bottom: 16px; width: 310px;
    background: rgba(11,13,17,.92); backdrop-filter: blur(6px);
    border: 1px solid var(--line2); border-radius: 12px; padding: 12px 14px; font-size: 12px;
  }
  .legend h4 { margin: 0 0 8px; font-size: 12px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
  .legend h4 button { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 14px; padding: 0; }
  .legend .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; direction: ltr; }
  .legend .it { white-space: nowrap; display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 10.5px; color: #aab3bf; }
  .legend hr { border: 0; border-top: 1px solid var(--line); margin: 9px 0; }
  .legend .full { grid-column: 1 / -1; }
  .legend.min .body { display: none; }
  .kb { display: inline-block; font-family: var(--mono); font-size: 8.5px; font-weight: 700; padding: 1px 5px; border-radius: 4px; border: 1px solid; }
  .kb.pk { color: var(--pk); border-color: #8a7420; background: rgba(255,212,59,.14); }
  .kb.fk { color: var(--store); border-color: #2a6490; background: rgba(77,171,247,.14); }
  .kb.uk { color: var(--identity); border-color: #6a5a9a; background: rgba(177,151,252,.14); }
  .pill { font-family: var(--mono); font-size: 9px; font-weight: 700; padding: 1px 7px; border-radius: 999px; border: 1px solid; background: var(--bg); }
  .pill.c { color: var(--ok); border-color: var(--ok); }
  .pill.r { color: var(--warn); border-color: var(--warn); }
  .pill.n { color: var(--logic); border-color: var(--logic); }
  .pill.e { color: var(--redis); border-color: var(--redis); }
  .swatch { width: 18px; height: 10px; border-radius: 3px; border: 1px solid var(--line2); }

  .hint {
    position: absolute; right: 16px; bottom: 16px; font-size: 11.5px; color: var(--muted);
    background: rgba(11,13,17,.8); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }

  /* ───────── درج الملاحظات ───────── */
  .drawer {
    position: absolute; top: 0; right: 0; bottom: 0; width: min(520px, 94vw);
    background: var(--panel); border-left: 1px solid var(--line2);
    transform: translateX(100%); transition: transform .25s ease; overflow-y: auto; padding: 18px 20px 40px;
    z-index: 4;
  }
  .drawer.open { transform: none; }
  .drawer h3 { margin: 22px 0 8px; font-size: 14px; padding-right: 10px; border-right: 3px solid var(--identity); }
  .drawer h3:first-of-type { margin-top: 4px; }
  .drawer .close { float: left; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 11.5px; }
  td code, li code {
    font-family: var(--mono); font-size: 11.5px; background: #151922; padding: 1px 6px; border-radius: 5px; color: #cbd5e1;
    direction: ltr; unicode-bidi: embed;
  }
  .drawer ul { margin: 0; padding: 0 18px 0 0; line-height: 1.9; font-size: 13px; color: #c3cad4; }
  .callout {
    margin-top: 12px; background: #1a1409; border: 1px solid #5c4420; border-radius: 10px;
    padding: 10px 14px; font-size: 12.5px; line-height: 1.8; color: #f0d9a8;
  }
  ::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: #232a34; border-radius: 8px; }
</style>
</head>
<body>

<div class="bar">
  <div class="brand">
    <span class="dot"></span>
    <h1>CoffeeStore · ERD</h1>
  </div>
  <span class="chip" id="chipE"></span>
  <span class="chip" id="chipR"></span>
  <span class="spacer"></span>

  <div class="group" id="zoneBtns">
    <button class="btn on" data-zone="all" style="--c:#fff">الكل</button>
    <button class="btn" data-zone="store" style="--c:var(--store)">CoffeeStoreDb</button>
    <button class="btn" data-zone="identity" style="--c:var(--identity)">Identity</button>
    <button class="btn" data-zone="redis" style="--c:var(--redis)">Redis</button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button class="btn icon" id="zOut" title="تصغير">−</button>
    <span id="zoomLabel">100%</span>
    <button class="btn icon" id="zIn" title="تكبير">+</button>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button class="btn" id="btnReset">إعادة الترتيب</button>
    <button class="btn" id="btnSvg">تصدير SVG</button>
    <button class="btn" id="btnPng">تصدير PNG</button>
    <button class="btn" id="btnNotes">الملاحظات</button>
  </div>
</div>

<div class="stage" id="stage">
  <svg id="cv" xmlns="http://www.w3.org/2000/svg" font-family="JetBrains Mono, Cascadia Code, SF Mono, Consolas, monospace">
    <defs>
      <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
        <circle cx="1.5" cy="1.5" r="1.1" fill="#1b2029" />
      </pattern>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
        <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity=".65" />
      </filter>
    </defs>
    <g id="world">
      <rect x="-6000" y="-6000" width="15000" height="15000" fill="#050608" />
      <rect x="-6000" y="-6000" width="15000" height="15000" fill="url(#dots)" />
      <g id="zoneLayer"></g>
      <g id="linkLayer"></g>
      <g id="cardLayer"></g>
    </g>
  </svg>

  <div class="legend" id="legend">
    <h4><span>دليل الرموز</span><button id="legToggle" title="طي">▾</button></h4>
    <div class="body">
      <div class="grid" id="legCard"></div>
      <hr />
      <div class="grid">
        <div class="it"><span class="kb pk">PK</span> Primary</div>
        <div class="it"><span class="kb fk">FK</span> Foreign</div>
        <div class="it"><span class="kb uk">UK</span> Unique</div>
        <div class="it"><span class="swatch" style="background:rgba(255,212,59,.18)"></span> Snapshot</div>
        <div class="it"><span class="swatch" style="background:rgba(56,217,169,.2)"></span> رابط منطقي</div>
        <div class="it"><span style="color:#6e7681;text-decoration:line-through">Unused</span> عمود ميّت</div>
      </div>
      <hr />
      <div class="grid">
        <div class="it"><span class="pill c">CASCADE</span></div>
        <div class="it"><span class="pill r">RESTRICT</span></div>
        <div class="it"><span class="pill n">NO FK</span></div>
        <div class="it"><span class="pill e">EMBEDDED</span></div>
        <div class="it full">
          <svg width="46" height="8"><line x1="0" y1="4" x2="46" y2="4" stroke="#38d9a9" stroke-width="1.6" stroke-dasharray="5 4" /></svg>
          علاقة منطقية بين قاعدتين
        </div>
      </div>
    </div>
  </div>

  <div class="hint">اسحب الكروت · عجلة الماوس للتكبير · مرّر على كيان لإبراز علاقاته</div>

  <aside class="drawer" id="drawer">
    <button class="btn close" id="drawerClose">إغلاق ✕</button>
    <div id="drawerBody"></div>
  </aside>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   1) البيانات — الكيانات والعلاقات (data-driven)
   ════════════════════════════════════════════════════════════ */
const W = 300, HEAD = 38, ROW = 22, PADB = 10;

const GROUPS = {
  store:    { color: '#4dabf7' },
  identity: { color: '#b197fc' },
  redis:    { color: '#ff6b6b' }
};

const E = {}, entities = [];
/* عمود: [الاسم, النوع, المفاتيح "PK FK UK", ملاحظة, وسم: snap | logic | dead | soft] */
function ent(id, group, table, x, y, cols) {
  const e = {
    id, group, table, x, y, x0: x, y0: y,
    cols: cols.map(c => ({ name: c[0], type: c[1], keys: (c[2] || '').split(' ').filter(Boolean), note: c[3] || '', tag: c[4] || '' }))
  };
  E[id] = e; entities.push(e); return e;
}

/* ── CoffeeStoreDb.Identity ── */
ent('USER', 'identity', 'Users', 500, 100, [
  ['Id', 'string', 'PK', 'AspNetUsers.Id (nvarchar 450)'],
  ['UserName', 'string', 'UK'],
  ['Email', 'string', 'UK'],
  ['EmailConfirmed', 'bool'],
  ['PasswordHash', 'string'],
  ['DisplayName', 'string'],
  ['LockoutEnabled', 'bool']
]);
ent('USER_ADDRESS', 'identity', 'Addresses', 80, 100, [
  ['Id', 'guid', 'PK'],
  ['UserId', 'string', 'FK', 'indexed'],
  ['Label', 'string'],
  ['FirstName', 'string'],
  ['LastName', 'string'],
  ['Country', 'string'],
  ['City', 'string'],
  ['Street', 'string'],
  ['Building', 'string'],
  ['Notes', 'string'],
  ['IsDefault', 'bool', '', 'عنوان التوصيل المفضّل']
]);
ent('USER_ROLE', 'identity', 'UserRoles', 500, 400, [
  ['UserId', 'string', 'PK FK'],
  ['RoleId', 'string', 'PK FK']
]);
ent('ROLE', 'identity', 'Roles', 80, 440, [
  ['Id', 'string', 'PK'],
  ['Name', 'string', 'UK', 'Admin / SuperAdmin / User'],
  ['NormalizedName', 'string']
]);

/* ── CoffeeStoreDb ── */
const X0 = 980, X1 = 1400, X2 = 1820;
ent('CATEGORY', 'store', 'Categories', X0, 100, [
  ['Id', 'guid', 'PK'],
  ['Name', 'string'],
  ['Slug', 'string', 'UK'],
  ['Description', 'string'],
  ['ImageUrl', 'string'],
  ['ParentCategoryId', 'guid', 'FK', 'self-ref, nullable'],
  ['CreatedAt', 'datetime'],
  ['IsDeleted', 'bool', '', 'soft delete', 'soft']
]);
ent('PRODUCT', 'store', 'Products', X1, 100, [
  ['Id', 'guid', 'PK'],
  ['Name', 'string'],
  ['Slug', 'string', 'UK'],
  ['Description', 'string'],
  ['Origin', 'string'],
  ['RoastLevel', 'string'],
  ['ImageUrl', 'string'],
  ['IsActive', 'bool'],
  ['IsFeatured', 'bool'],
  ['CategoryId', 'guid', 'FK'],
  ['IsDeleted', 'bool', '', 'soft delete', 'soft']
]);
ent('PRODUCT_VARIANT', 'store', 'ProductVariants', X2, 100, [
  ['Id', 'guid', 'PK'],
  ['ProductId', 'guid', 'FK'],
  ['WeightInGrams', 'int'],
  ['GrindType', 'string'],
  ['Price', 'decimal'],
  ['StockQuantity', 'int'],
  ['Sku', 'string', 'UK'],
  ['IsDeleted', 'bool', '', 'soft delete', 'soft']
]);
ent('CUSTOMER', 'store', 'Customers', X0, 440, [
  ['Id', 'guid', 'PK'],
  ['IdentityUserId', 'string', 'UK', 'logical link to Users.Id — بدون FK (قاعدتين مختلفتين)', 'logic'],
  ['FullName', 'string'],
  ['Email', 'string', 'UK'],
  ['PhoneNumber', 'string'],
  ['IsDeleted', 'bool', '', 'soft delete', 'soft']
]);
ent('CART', 'store', 'Carts', X1, 440, [
  ['Id', 'guid', 'PK'],
  ['CustomerId', 'guid', 'FK UK', 'unique = سلة واحدة لكل عميل'],
  ['IsDeleted', 'bool', '', 'soft delete', 'soft']
]);
ent('CART_ITEM', 'store', 'CartItems', X2, 440, [
  ['Id', 'guid', 'PK'],
  ['CartId', 'guid', 'FK'],
  ['ProductVariantId', 'guid', 'FK'],
  ['Quantity', 'int'],
  ['UnitPrice', 'decimal'],
  ['IsDeleted', 'bool', '', 'soft delete', 'soft']
]);
ent('PAYMENT', 'store', 'Payments', X0, 740, [
  ['Id', 'guid', 'PK'],
  ['OrderId', 'guid', 'FK UK', 'unique = دفع واحد لكل أوردر'],
  ['Method', 'string'],
  ['Status', 'string'],
  ['Amount', 'decimal'],
  ['TransactionReference', 'string'],
  ['PaidAt', 'datetime'],
  ['IsDeleted', 'bool', '', 'soft delete', 'soft']
]);
ent('ORDER', 'store', 'Orders', X1, 740, [
  ['Id', 'guid', 'PK'],
  ['OrderNumber', 'string', 'UK'],
  ['CustomerId', 'guid', 'FK'],
  ['DeliveryMethodId', 'guid', 'FK'],
  ['UserEmail', 'string', '', 'soft link → Users.Email (بدون FK)', 'logic'],
  ['Status', 'string'],
  ['SubTotal', 'decimal'],
  ['ShippingFee', 'decimal'],
  ['DeliveryMethodPrice', 'decimal'],
  ['ShipToAddress_FirstName', 'string', '', 'frozen snapshot', 'snap'],
  ['ShipToAddress_LastName', 'string', '', 'frozen snapshot', 'snap'],
  ['ShipToAddress_Street', 'string', '', 'frozen snapshot', 'snap'],
  ['ShipToAddress_City', 'string', '', 'frozen snapshot', 'snap'],
  ['ShipToAddress_Country', 'string', '', 'frozen snapshot', 'snap'],
  ['ShippingAddressId', 'guid', '', 'orphan column — مفيش FK ولا index ولا استخدام', 'dead'],
  ['IsDeleted', 'bool', '', 'soft delete', 'soft']
]);
ent('ORDER_ITEM', 'store', 'OrderItems', X2, 740, [
  ['Id', 'guid', 'PK'],
  ['OrderId', 'guid', 'FK'],
  ['ProductVariantId', 'guid', 'FK'],
  ['ProductNameSnapshot', 'string', '', 'snapshot', 'snap'],
  ['WeightInGramsSnapshot', 'int', '', 'snapshot', 'snap'],
  ['UnitPriceSnapshot', 'decimal', '', 'snapshot', 'snap'],
  ['Quantity', 'int']
]);
ent('DELIVERY_METHOD', 'store', 'DeliveryMethods', X0, 1040, [
  ['Id', 'guid', 'PK'],
  ['Name', 'string', 'UK'],
  ['Description', 'string'],
  ['Price', 'decimal'],
  ['EstimatedDeliveryTime', 'string'],
  ['IsAvailable', 'bool'],
  ['DisplayOrder', 'int'],
  ['IsDeleted', 'bool', '', 'soft delete', 'soft']
]);

/* ── Redis ── */
ent('BASKET_CUSTOMER', 'redis', 'JSON', 2320, 100, [
  ['Id', 'guid', 'PK', 'redis key (basketId)']
]);
ent('BASKET_ITEM', 'redis', 'JSON', 2320, 260, [
  ['ProductId', 'guid', '', 'reference only — بدون FK', 'logic'],
  ['ProductName', 'string'],
  ['PictureUrl', 'string'],
  ['UnitPrice', 'decimal'],
  ['Quantity', 'int']
]);

/* ── المناطق (قواعد البيانات) ── */
const ZONES = [
  { id: 'identity', group: 'identity', x: 40,   y: 40, w: 840,  h: 570,  title: 'CoffeeStoreDb.Identity', sub: 'المستخدمين · الأدوار · عناوين المستخدم' },
  { id: 'store',    group: 'store',    x: 900,  y: 40, w: 1320, h: 1260, title: 'CoffeeStoreDb',          sub: 'الكتالوج · السلة · الأوردرات · الدفع' },
  { id: 'redis',    group: 'redis',    x: 2280, y: 40, w: 380,  h: 430,  title: 'Redis',                   sub: 'السلة المؤقتة (JSON)' }
];

/* ── العلاقات ──
   from = الطرف الأب (one) · to = الطرف الابن (many)
   fcard/tcard: '1' | '0..1' | '1..*' | '0..*'     del: CASCADE | RESTRICT | EMBEDDED | null */
const rels = [
  { from: 'CATEGORY', fcol: 'Id', to: 'PRODUCT', tcol: 'CategoryId', fcard: '1', tcard: '0..*', del: 'RESTRICT', label: 'contains',
    fk: 'Products.CategoryId', why: 'متحذفش تصنيف جواه منتجات' },
  { from: 'CATEGORY', fcol: 'Id', to: 'CATEGORY', tcol: 'ParentCategoryId', fcard: '0..1', tcard: '0..*', del: 'RESTRICT', label: 'parent / sub-category',
    sides: ['L', 'L'], bend: 34, fk: 'Categories.ParentCategoryId', why: 'شجرة تصنيفات — مينفعش تحذف أب وهو عنده أبناء' },
  { from: 'PRODUCT', fcol: 'Id', to: 'PRODUCT_VARIANT', tcol: 'ProductId', fcard: '1', tcard: '1..*', del: 'CASCADE', label: 'variants',
    fk: 'ProductVariants.ProductId', why: 'حذف المنتج يمسح أوزانه وطحناته معاه' },
  { from: 'CUSTOMER', fcol: 'Id', to: 'CART', tcol: 'CustomerId', fcard: '1', tcard: '1', del: 'CASCADE', label: 'one active cart',
    fk: 'Carts.CustomerId (unique)', why: 'سلة واحدة نشطة لكل عميل' },
  { from: 'CART', fcol: 'Id', to: 'CART_ITEM', tcol: 'CartId', fcard: '1', tcard: '1..*', del: 'CASCADE', label: 'line items',
    fk: 'CartItems.CartId', why: 'حذف السلة يمسح محتوياتها' },
  { from: 'PRODUCT_VARIANT', fcol: 'Id', to: 'CART_ITEM', tcol: 'ProductVariantId', fcard: '1', tcard: '0..*', del: 'RESTRICT', label: 'priced from',
    sides: ['R', 'R'], bend: 30, fk: 'CartItems.ProductVariantId', why: 'متحذفش variant وهو في سلة حد' },
  { from: 'CUSTOMER', fcol: 'Id', to: 'ORDER', tcol: 'CustomerId', fcard: '1', tcard: '1..*', del: 'RESTRICT', label: 'places', mid: 0.15,
    fk: 'Orders.CustomerId', why: 'حماية سجل الطلبات لو بيانات العميل اتمسحت' },
  { from: 'DELIVERY_METHOD', fcol: 'Id', to: 'ORDER', tcol: 'DeliveryMethodId', fcard: '1', tcard: '0..*', del: 'RESTRICT', label: 'shipping via', mid: 0.7,
    fk: 'Orders.DeliveryMethodId', why: 'متحذفش طريقة توصيل متسجّل بيها أوردرات' },
  { from: 'ORDER', fcol: 'Id', to: 'ORDER_ITEM', tcol: 'OrderId', fcard: '1', tcard: '1..*', del: 'CASCADE', label: 'line items',
    fk: 'OrderItems.OrderId', why: 'حذف الأوردر يمسح بنوده' },
  { from: 'ORDER', fcol: 'Id', to: 'PAYMENT', tcol: 'OrderId', fcard: '1', tcard: '0..1', del: 'CASCADE', label: 'paid by', mid: 0.6,
    fk: 'Payments.OrderId (unique)', why: 'دفع واحد لكل أوردر (1:1)' },
  { from: 'PRODUCT_VARIANT', fcol: 'Id', to: 'ORDER_ITEM', tcol: 'ProductVariantId', fcard: '1', tcard: '0..*', del: 'RESTRICT', label: 'snapshot source',
    sides: ['R', 'R'], bend: 62, fk: 'OrderItems.ProductVariantId', why: 'مرجع تاريخي + الاسم والسعر محفوظين كـ snapshot' },
  { from: 'USER', fcol: 'Id', to: 'USER_ADDRESS', tcol: 'UserId', fcard: '1', tcard: '1..*', del: 'CASCADE', label: 'address book',
    fk: 'Addresses.UserId', why: 'عنوان المستخدم يروح معاه' },
  { from: 'USER', fcol: 'Id', to: 'USER_ROLE', tcol: 'UserId', fcard: '1', tcard: '0..*', del: null, label: 'assigned',
    sides: ['R', 'R'], bend: 40 },
  { from: 'ROLE', fcol: 'Id', to: 'USER_ROLE', tcol: 'RoleId', fcard: '1', tcard: '0..*', del: null, label: 'assigned via UserRoles' },

    sides: ['R', 'R'], bend: 30 },

  /* علاقات منطقية (بدون FK) */
  { logic: true, from: 'CUSTOMER', fcol: 'IdentityUserId', to: 'USER', tcol: 'Id', fcard: '1', tcard: '1', del: 'NO FK', label: 'IdentityUserId (unique, no FK)',
    sides: ['L', 'R'], fk: 'Customer.IdentityUserId → Users.Id', why: 'القاعدتين مختلفتين فمفيش FK — الربط بـ unique index', badge: 'cross-DB' },
  { logic: true, from: 'BASKET_ITEM', fcol: 'ProductId', to: 'PRODUCT_VARIANT', tcol: 'Id', fcard: '0..*', tcard: '1', del: 'NO FK', label: 'ProductId (no FK)',
    sides: ['L', 'R'], fk: 'BasketItem.ProductId → ProductVariants.Id', why: 'السلة في Redis ومبيتحمّلش من القاعدة', badge: 'Redis' }

const PILL = {
  'CASCADE':  '#51cf66',
  'RESTRICT': '#fcc419',
  'NO FK':    '#38d9a9',
  'EMBEDDED': '#ff6b6b'
};
const LINK_BASE = '#5b6573', LINK_LOGIC = '#38d9a9', LINK_HI = '#f4f6f9', LINK_LOGIC_HI = '#7af0cf';

/* ════════════════════════════════════════════════════════════
   2) أدوات SVG
   ════════════════════════════════════════════════════════════ */
const NS = 'http://www.w3.org/2000/svg';
function el(tag, attrs, parent) {
  const n = document.createElementNS(NS, tag);
  if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function txt(parent, s, attrs) { const t = el('text', attrs, parent); t.textContent = s; return t; }

const svg = document.getElementById('cv');
const world = document.getElementById('world');
const zoneLayer = document.getElementById('zoneLayer');
const linkLayer = document.getElementById('linkLayer');
const cardLayer = document.getElementById('cardLayer');

const KEY_COLOR = { PK: '#ffd43b', FK: '#4dabf7', UK: '#b197fc' };
const TAG_TINT = { snap: ['#ffd43b', .075], logic: ['#38d9a9', .08] };

/* ════════════════════════════════════════════════════════════
   3) المناطق
   ════════════════════════════════════════════════════════════ */
function drawZones() {
  ZONES.forEach(z => {
    const c = GROUPS[z.group].color;
    el('rect', { x: z.x, y: z.y, width: z.w, height: z.h, rx: 20, fill: c, 'fill-opacity': .03, stroke: c, 'stroke-opacity': .3, 'stroke-dasharray': '7 7' }, zoneLayer);
    el('circle', { cx: z.x + 30, cy: z.y + 33, r: 5, fill: c }, zoneLayer);
    txt(zoneLayer, z.title, { x: z.x + 46, y: z.y + 38, fill: c, 'font-size': 16, 'font-weight': 700 });
    txt(zoneLayer, z.sub, { x: z.x + z.w - 26, y: z.y + 37, fill: '#6b7683', 'font-size': 11.5, 'text-anchor': 'end', 'font-family': 'Segoe UI, Tahoma, sans-serif' });
  });
}

/* ════════════════════════════════════════════════════════════
   4) الكروت (الكيانات)
   ════════════════════════════════════════════════════════════ */
function drawCard(e) {
  const gc = GROUPS[e.group].color;
  const h = HEAD + e.cols.length * ROW + PADB;
  e.h = h;

  const g = el('g', { class: 'card', 'data-id': e.id, transform: `translate(${e.x},${e.y})`, style: 'cursor:grab' }, cardLayer);
  e.g = g;

  el('rect', { width: W, height: h, rx: 10, fill: '#0e1116', stroke: '#2a313c', filter: 'url(#shadow)' }, g);
  const clip = el('clipPath', { id: 'clip-' + e.id }, g);
  el('rect', { width: W, height: h, rx: 10 }, clip);
  const inner = el('g', { 'clip-path': `url(#clip-${e.id})` }, g);

  el('rect', { width: W, height: HEAD, fill: gc, 'fill-opacity': .13 }, inner);
  el('rect', { width: W, height: 3, fill: gc }, inner);
  el('line', { x1: 0, x2: W, y1: HEAD, y2: HEAD, stroke: gc, 'stroke-opacity': .4 }, inner);

  txt(inner, e.id, { x: 14, y: HEAD / 2 + 6, fill: '#f1f4f8', 'font-size': 13, 'font-weight': 700, 'letter-spacing': '.3' });
  txt(inner, e.table, { x: W - 14, y: HEAD / 2 + 5, fill: gc, 'fill-opacity': .85, 'font-size': 10.5, 'text-anchor': 'end' });

  e.cols.forEach((c, i) => {
    const y = HEAD + i * ROW;
    const tint = TAG_TINT[c.tag];
    const bg = el('rect', { class: 'row-bg', x: 0, y, width: W, height: ROW, fill: tint ? tint[0] : 'transparent', 'fill-opacity': tint ? tint[1] : 1 }, inner);
    if (tint) {
      // الـ hover لا يعمل مع fill-opacity المنخفض، لذلك نضيف طبقة شفافة فوقه
      el('rect', { class: 'row-bg', x: 0, y, width: W, height: ROW, fill: 'transparent' }, inner)
        .appendChild(document.createElementNS(NS, 'title')).textContent = rowTip(c);
      bg.removeAttribute('class');
    } else {
      bg.appendChild(document.createElementNS(NS, 'title')).textContent = rowTip(c);
    }
    if (i < e.cols.length - 1) el('line', { x1: 10, x2: W - 10, y1: y + ROW, y2: y + ROW, stroke: '#171c23' }, inner);

    // شارات المفاتيح
    const n = c.keys.length;
    const bw = n === 1 ? 30 : 15;
    c.keys.forEach((k, ki) => {
      const bx = 10 + ki * (bw + 2);
      el('rect', { x: bx, y: y + 4, width: bw, height: 14, rx: 3.5, fill: KEY_COLOR[k], 'fill-opacity': .15, stroke: KEY_COLOR[k], 'stroke-opacity': .65 }, inner);
      txt(inner, k, { x: bx + bw / 2, y: y + 14.2, fill: KEY_COLOR[k], 'font-size': n === 1 ? 8.5 : 7, 'font-weight': 700, 'text-anchor': 'middle' });
    });

    // الاسم والنوع
    let nameFill = '#d3d9e1', extra = {};
    if (c.keys.includes('PK')) nameFill = '#fff1b8';
    if (c.tag === 'snap') nameFill = '#ffe08a';
    if (c.tag === 'logic') nameFill = '#7af0cf';
    if (c.tag === 'soft') nameFill = '#5d6772';
    if (c.tag === 'dead') { nameFill = '#6e7681'; extra['text-decoration'] = 'line-through'; }
    txt(inner, c.name, Object.assign({ x: 50, y: y + 15, fill: nameFill, 'font-size': 12 }, extra));
    txt(inner, c.type, { x: W - 12, y: y + 15, fill: '#6b7683', 'font-size': 10.5, 'text-anchor': 'end' });
  });
}
function rowTip(c) { return `${c.name} : ${c.type}${c.keys.length ? '  [' + c.keys.join(', ') + ']' : ''}${c.note ? '\n' + c.note : ''}`; }

/* ════════════════════════════════════════════════════════════
   5) العلاقات (راوتر متعامد + crow's foot)
   ════════════════════════════════════════════════════════════ */
function rowY(e, colName) {
  if (!colName) return e.y + HEAD / 2;
  const i = e.cols.findIndex(c => c.name === colName);
  return e.y + HEAD + i * ROW + ROW / 2;
}

function route(r) {
  const a = E[r.from], b = E[r.to];
  const ay = rowY(a, r.fcol), by = rowY(b, r.tcol);
  let sa, sb;
  if (r.sides) { [sa, sb] = r.sides; }
  else if (a.x + W + 20 <= b.x) { sa = 'R'; sb = 'L'; }
  else if (b.x + W + 20 <= a.x) { sa = 'L'; sb = 'R'; }
  else { sa = 'R'; sb = 'R'; }
  const ax = sa === 'R' ? a.x + W : a.x, bx = sb === 'R' ? b.x + W : b.x;
  const ad = sa === 'R' ? 1 : -1, bd = sb === 'R' ? 1 : -1;

  if (r.logic) {
    const off = Math.max(80, Math.abs(bx - ax) * .4);
    const c1x = ax + ad * off, c2x = bx + bd * off;
    return {
      kind: 'curve', ax, ay, bx, by, ad, bd,
      d: `M${ax},${ay} C${c1x},${ay} ${c2x},${by} ${bx},${by}`,
      pill: { x: (ax + 3 * c1x + 3 * c2x + bx) / 8, y: (ay + by) / 2 }
    };
  }

  let pts, pill;
  if (sa !== sb) {
    const mid = ax + (bx - ax) * (r.mid == null ? .5 : r.mid);
    pts = [[ax, ay], [mid, ay], [mid, by], [bx, by]];
    pill = { x: mid, y: (ay + by) / 2 };
  } else {
    const bend = r.bend == null ? 30 : r.bend;
    const x = sa === 'R' ? Math.max(ax, bx) + bend : Math.min(ax, bx) - bend;
    pts = [[ax, ay], [x, ay], [x, by], [bx, by]];
    pill = { x, y: (ay + by) / 2 };
  }
  return { kind: 'ortho', ax, ay, bx, by, ad, bd, d: roundedPath(pts, 9), pill };
}

function roundedPath(pts, r) {
  const p = pts.filter((q, i) => i === 0 || q[0] !== pts[i - 1][0] || q[1] !== pts[i - 1][1]);
  let d = `M${p[0][0]},${p[0][1]}`;
  for (let i = 1; i < p.length - 1; i++) {
    const [x0, y0] = p[i - 1], [x1, y1] = p[i], [x2, y2] = p[i + 1];
    const l1 = Math.hypot(x1 - x0, y1 - y0), l2 = Math.hypot(x2 - x1, y2 - y1);
    const rr = Math.min(r, l1 / 2, l2 / 2);
    const qx = x1 + (x0 - x1) / l1 * rr, qy = y1 + (y0 - y1) / l1 * rr;
    const wx = x1 + (x2 - x1) / l2 * rr, wy = y1 + (y2 - y1) / l2 * rr;
    d += ` L${qx},${qy} Q${x1},${y1} ${wx},${wy}`;
  }
  const last = p[p.length - 1];
  return d + ` L${last[0]},${last[1]}`;
}

/* رموز الـ cardinality — d = اتجاه الخط بعيداً عن حافة الكارت */
function marker(parent, card, x, y, d) {
  const bar = o => el('line', { x1: x + d * o, x2: x + d * o, y1: y - 6, y2: y + 6 }, parent);
  const ring = o => el('circle', { cx: x + d * o, cy: y, r: 4, fill: '#050608' }, parent);
  const crow = () => {
    el('line', { x1: x + d * 14, y1: y, x2: x, y2: y - 7 }, parent);
    el('line', { x1: x + d * 14, y1: y, x2: x, y2: y + 7 }, parent);
  };
  switch (card) {
    case '1':    bar(8); bar(13); break;
    case '0..1': bar(8); ring(17); break;
    case '1..*': crow(); bar(19); break;
    case '0..*': crow(); ring(20); break;
  }
}

let hovered = null;

function drawLinks() {
  linkLayer.innerHTML = '';
  rels.forEach(r => {
    const rt = route(r);
    const base = r.logic ? LINK_LOGIC : LINK_BASE;
    const g = el('g', {
      class: 'link', 'data-a': r.from, 'data-b': r.to, 'data-base': base, 'data-logic': r.logic ? '1' : '',
      stroke: base, 'stroke-width': 1.5, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round'
    }, linkLayer);
    el('title', null, g).textContent = `${r.from} → ${r.to}  ·  ${r.label}`;
    const path = el('path', { d: rt.d }, g);
    if (r.logic) path.setAttribute('stroke-dasharray', '6 5');
    marker(g, r.fcard, rt.ax, rt.ay, rt.ad);
    marker(g, r.tcard, rt.bx, rt.by, rt.bd);

    if (r.del) {
      const col = PILL[r.del], w = r.del.length * 5.9 + 16;
      el('rect', { x: rt.pill.x - w / 2, y: rt.pill.y - 8, width: w, height: 16, rx: 8, fill: '#07090c', stroke: col, 'stroke-width': 1 }, g);
      txt(g, r.del, { x: rt.pill.x, y: rt.pill.y + 3.2, fill: col, stroke: 'none', 'font-size': 8.5, 'font-weight': 700, 'text-anchor': 'middle' });
    }
  });
  applyFocus();
}

/* ════════════════════════════════════════════════════════════
   6) إبراز العلاقات عند المرور
   ════════════════════════════════════════════════════════════ */
function applyFocus() {
  const id = hovered;
  const cards = cardLayer.querySelectorAll('.card');
  const links = linkLayer.querySelectorAll('.link');
  if (!id) {
    cards.forEach(c => c.style.opacity = 1);
    links.forEach(l => { l.style.opacity = 1; l.setAttribute('stroke', l.dataset.base); l.setAttribute('stroke-width', 1.5); });
    return;
  }
  const rel = new Set([id]);
  rels.forEach(r => { if (r.from === id || r.to === id) { rel.add(r.from); rel.add(r.to); } });
  cards.forEach(c => c.style.opacity = rel.has(c.dataset.id) ? 1 : .22);
  links.forEach(l => {
    const on = l.dataset.a === id || l.dataset.b === id;
    l.style.opacity = on ? 1 : .08;
    l.setAttribute('stroke', on ? (l.dataset.logic ? LINK_LOGIC_HI : LINK_HI) : l.dataset.base);
    l.setAttribute('stroke-width', on ? 2 : 1.5);
  });
}

/* ════════════════════════════════════════════════════════════
   7) التحكم: سحب الكروت · تحريك اللوحة · التكبير
   ════════════════════════════════════════════════════════════ */
const view = { x: 0, y: 0, k: 1 };
const zoomLabel = document.getElementById('zoomLabel');
function applyView() {
  world.setAttribute('transform', `translate(${view.x},${view.y}) scale(${view.k})`);
  zoomLabel.textContent = Math.round(view.k * 100) + '%';
}
function zoomAt(cx, cy, f) {
  const r = svg.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const nk = Math.min(2.5, Math.max(.08, view.k * f));
  const q = nk / view.k;
  view.x = px - (px - view.x) * q;
  view.y = py - (py - view.y) * q;
  view.k = nk;
  applyView();
}
svg.addEventListener('wheel', ev => { ev.preventDefault(); zoomAt(ev.clientX, ev.clientY, Math.exp(-ev.deltaY * .0015)); }, { passive: false });

let drag = null, pan = null;
const snap = v => Math.round(v / 10) * 10;

svg.addEventListener('pointerdown', ev => {
  const card = ev.target.closest('.card');
  svg.setPointerCapture(ev.pointerId);
  if (card) {
    const e = E[card.dataset.id];
    drag = { e, sx: ev.clientX, sy: ev.clientY, ox: e.x, oy: e.y };
    card.style.cursor = 'grabbing';
    cardLayer.appendChild(card); // إحضار الكارت للأمام
  } else {
    pan = { sx: ev.clientX, sy: ev.clientY, ox: view.x, oy: view.y };
    svg.classList.add('panning');
  }
});
svg.addEventListener('pointermove', ev => {
  if (drag) {
    drag.e.x = snap(drag.ox + (ev.clientX - drag.sx) / view.k);
    drag.e.y = snap(drag.oy + (ev.clientY - drag.sy) / view.k);
    drag.e.g.setAttribute('transform', `translate(${drag.e.x},${drag.e.y})`);
    drawLinks();
  } else if (pan) {
    view.x = pan.ox + ev.clientX - pan.sx;
    view.y = pan.oy + ev.clientY - pan.sy;
    applyView();
  }
});
function endPointer(ev) {
  if (drag) { drag.e.g.style.cursor = 'grab'; drag = null; }
  if (pan) { pan = null; svg.classList.remove('panning'); }
  if (svg.hasPointerCapture(ev.pointerId)) svg.releasePointerCapture(ev.pointerId);
}
svg.addEventListener('pointerup', endPointer);
svg.addEventListener('pointercancel', endPointer);

svg.addEventListener('pointerover', ev => {
  if (drag || pan) return;
  const c = ev.target.closest('.card');
  const id = c ? c.dataset.id : null;
  if (id !== hovered) { hovered = id; applyFocus(); }
});
svg.addEventListener('pointerleave', () => { if (!drag) { hovered = null; applyFocus(); } });

/* ملاءمة العرض + أنيميشن */
function boundsOf(ids) {
  const zs = ids === 'all' ? ZONES : ZONES.filter(z => z.id === ids);
  const x1 = Math.min(...zs.map(z => z.x)), y1 = Math.min(...zs.map(z => z.y));
  const x2 = Math.max(...zs.map(z => z.x + z.w)), y2 = Math.max(...zs.map(z => z.y + z.h));
  return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
}
function viewFor(b, pad) {
  const r = svg.getBoundingClientRect();
  const k = Math.min((r.width - pad * 2) / b.w, (r.height - pad * 2) / b.h, 1.4);
  return { k, x: (r.width - b.w * k) / 2 - b.x * k, y: (r.height - b.h * k) / 2 - b.y * k };
}
function animateTo(t) {
  const s = { x: view.x, y: view.y, k: view.k }, t0 = performance.now(), D = 480;
  (function step(now) {
    const p = Math.min(1, (now - t0) / D), e = 1 - Math.pow(1 - p, 3);
    view.x = s.x + (t.x - s.x) * e; view.y = s.y + (t.y - s.y) * e; view.k = s.k + (t.k - s.k) * e;
    applyView();
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}
function focusZone(id, animate = true) {
  const t = viewFor(boundsOf(id), 50);
  if (animate) animateTo(t); else { Object.assign(view, t); applyView(); }
  document.querySelectorAll('#zoneBtns .btn').forEach(b => b.classList.toggle('on', b.dataset.zone === id));
}

document.querySelectorAll('#zoneBtns .btn').forEach(b => b.addEventListener('click', () => focusZone(b.dataset.zone)));
document.getElementById('zIn').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, 1.25); };
document.getElementById('zOut').onclick = () => { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, .8); };
svg.addEventListener('dblclick', ev => { if (!ev.target.closest('.card')) focusZone('all'); });
window.addEventListener('resize', () => { /* يحافظ على الوضع الحالي */ });

document.getElementById('btnReset').onclick = () => {
  entities.forEach(e => { e.x = e.x0; e.y = e.y0; e.g.setAttribute('transform', `translate(${e.x},${e.y})`); });
  drawLinks(); focusZone('all');
};

/* ════════════════════════════════════════════════════════════
   8) التصدير SVG / PNG
   ════════════════════════════════════════════════════════════ */
function buildExport() {
  const b = boundsOf('all'), pad = 40;
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', NS);
  clone.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.w + pad * 2} ${b.h + pad * 2}`);
  clone.setAttribute('width', b.w + pad * 2);
  clone.setAttribute('height', b.h + pad * 2);
  clone.removeAttribute('style');
  clone.querySelector('#world').removeAttribute('transform');
  clone.querySelectorAll('[style]').forEach(n => n.removeAttribute('style'));
  return { xml: new XMLSerializer().serializeToString(clone), w: b.w + pad * 2, h: b.h + pad * 2 };
}
function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
document.getElementById('btnSvg').onclick = () => {
  download(new Blob([buildExport().xml], { type: 'image/svg+xml' }), 'CoffeeStore-ERD.svg');
};
document.getElementById('btnPng').onclick = () => {
  const { xml, w, h } = buildExport();
  const sc = Math.min(2, 8000 / Math.max(w, h));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * sc); cv.height = Math.round(h * sc);
    const ctx = cv.getContext('2d');
    ctx.fillStyle = '#050608'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(img, 0, 0, cv.width, cv.height);
    cv.toBlob(b => download(b, 'CoffeeStore-ERD.png'), 'image/png');
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
};

/* ════════════════════════════════════════════════════════════
   9) الدليل + درج الملاحظات
   ════════════════════════════════════════════════════════════ */
(function buildLegend() {
  const box = document.getElementById('legCard');
  [['1', 'exactly one'], ['0..1', 'zero or one'], ['1..*', 'one or many'], ['0..*', 'zero or many']].forEach(([c, label]) => {
    const it = document.createElement('div'); it.className = 'it';
    const s = el('svg', { width: 50, height: 18 });
    const g = el('g', { stroke: '#aab3bf', 'stroke-width': 1.4, fill: 'none', 'stroke-linecap': 'round' }, s);
    el('line', { x1: 0, y1: 9, x2: 40, y2: 9 }, g);
    el('line', { x1: 40, y1: 1, x2: 40, y2: 17, 'stroke-width': 2.4, stroke: '#3a424d' }, g);
    marker(g, c, 40, 9, -1);
    it.appendChild(s);
    it.appendChild(document.createTextNode(label));
    box.appendChild(it);
  });
})();
document.getElementById('legToggle').onclick = function () {
  const l = document.getElementById('legend'); l.classList.toggle('min'); this.textContent = l.classList.contains('min') ? '▸' : '▾';
};

(function buildDrawer() {
  const fkRows = rels.filter(r => !r.logic && r.why).map(r => {
    const cls = r.del === 'CASCADE' ? 'c' : 'r';
    return `<tr><td><code>${r.from} → ${r.to}</code></td><td><code>${r.fk}</code></td><td><span class="pill ${cls}">${r.del}</span></td><td>${r.why}</td></tr>`;
  }).join('');
  const logicRows = rels.filter(r => r.logic).map(r =>
    `<tr><td><code>${r.fk}</code></td><td><span class="pill n">${r.badge}</span> ${r.why}</td></tr>`).join('');

  document.getElementById('drawerBody').innerHTML = `
    <h3>ليه كل FK عامل كده؟</h3>
    <table>
      <tr><th>العلاقة</th><th>FK</th><th>عند الحذف</th><th>السبب</th></tr>
      ${fkRows}
    </table>

    <h3 style="border-color:#38d9a9">علاقات منطقية (بدون FK)</h3>
    <table>
      <tr><th>الربط</th><th>السبب</th></tr>
      ${logicRows}
      <tr><td><code>Order.UserEmail → Users.Email</code></td><td><span class="pill n">soft link</span> نص حر للتفريق بين المستخدمين</td></tr>
    </table>

    <h3 style="border-color:#4dabf7">ملاحظات على التصميم</h3>
    <ul>
      <li><b>Soft delete:</b> <code>IsDeleted</code> + query filter على أغلب الجداول (ماعدا <code>OrderItems</code>).</li>
      <li><b>Snapshot pattern:</b> <code>Orders.ShipToAddress_*</code> و <code>OrderItems.*Snapshot</code> — تفاصيل الأوردر القديم ما تتغيرش لو المنتج أو العنوان اتغيّروا.</li>
      <li><b>Owned types:</b> <code>ShipToAddress</code> و <code>ItemOrdered</code> أعمدتهم على نفس الجدول — قيمة مجمّدة مش جدول مستقل.</li>
      <li><b>Identity extras:</b> <code>UserClaims / UserLogins / UserTokens / RoleClaims</code> متـ <code>Ignore</code> — مش موجودة.</li>
      <li><b>Redis:</b> السلة documents بـ JSON، والـ key هو <code>basketId</code>.</li>
    </ul>
    <div class="callout">
      <b>عمود ميّت:</b> <code>Orders.ShippingAddressId</code> مفيش عليه FK ولا index ولا استخدام.<br />
      <b>تنبيه:</b> جدول <code>Addresses</code> تابع لقاعدة الهوية، و<b>مش</b> هو <code>Customers.Addresses</code> القديم اللي اتشال من الكود.
    </div>`;
})();
const drawer = document.getElementById('drawer');
document.getElementById('btnNotes').onclick = () => drawer.classList.toggle('open');
document.getElementById('drawerClose').onclick = () => drawer.classList.remove('open');

/* ════════════════════════════════════════════════════════════
   10) تشغيل
   ════════════════════════════════════════════════════════════ */
document.getElementById('chipE').textContent = entities.length + ' كيان';
document.getElementById('chipR').textContent = rels.filter(r => !r.logic).length + ' FK · ' + rels.filter(r => r.logic).length + ' منطقية';

drawZones();
entities.forEach(drawCard);
drawLinks();
focusZone('all', false);
</script>
